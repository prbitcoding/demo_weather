<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Basic reset and body styling */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            background-color: #f9f9f9;
            color: #333;
        }

        /* Styling for the main title */
        h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 0.5em;
        }

        /* Styling for the second level heading */
        h2 {
            color: #34495e;
            font-size: 2em;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            border-bottom: 2px solid #2980b9;
            padding-bottom: 0.3em;
        }

        /* Styling for the third level heading */
        h3 {
            color: #34495e;
            font-size: 1.5em;
            margin-top: 1.2em;
            margin-bottom: 0.4em;
        }

        /* Paragraph styling */
        p {
            font-size: 1em;
            margin-bottom: 1em;
            color: #555;
        }
    </style>
</head>

<body>
    <h1> The ultimate HTML sourcecode </h1>
    <h2> Introduction </h2>
    <p>Html is a insenstive language </p>
    <h3> History og Html </h3>
    <p>Tim berners lee...</p>
</body>

</html>
